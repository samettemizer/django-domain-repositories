[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-domain-repositories"
version = "0.1.0"
description = "Convention-driven repository binding for domain-oriented Django architectures."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Samet TEMIZER", email = "nestisamet@gmail.com"},
]
keywords = ["django", "repository", "domain", "ddd", "dependency-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Engineering",
]
dependencies = [
    "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/samettemizer/django-domain-repositories"
Repository = "https://github.com/samettemizer/django-domain-repositories"
Issues = "https://github.com/samettemizer/django-domain-repositories/issues"

[tool.setuptools.packages.find]
where = ["src"]
